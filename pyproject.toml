[project]
name = "game-review-graph"
version = "0.1.0"
description = "Topic detection in game reviews via hierarchical graphs and progressive edge cutting"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "nltk>=3.9",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.23",
    "moto[s3]>=5.0",
    "mkdocs-material>=9.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not env'"
markers = [
    "env: environment integrity tests that run make targets on the host (deselect with '-m not env')",
]
