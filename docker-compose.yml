services:
  app:
    build: .
    env_file: .env
    depends_on:
      - minio
      - redis
    volumes:
      # Mount the datasets so locally generated corpora (make gen-data) are
      # available to init-data without rebuilding the image. The Dockerfile
      # still bakes in data/ as a fallback for standalone/CI runs.
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  minio_data:
  redis_data:
  frontend_node_modules:
