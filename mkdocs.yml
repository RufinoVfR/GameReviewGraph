site_name: GameReviewGraph
site_url: https://rufinovfr.github.io/GameReviewGraph/
repo_url: https://github.com/RufinoVfR/GameReviewGraph
repo_name: RufinoVfR/GameReviewGraph

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tables

# CLAUDE.md is a Claude Code context file, not site content — keep it out of the build.
exclude_docs: |
  CLAUDE.md

nav:
  - Início: index.md
  - Projeto:
    - Visão do Produto e Projeto: visao_produto_projeto.md
    - Cronograma: cronograma.md
  - Engenharia de Requisitos:
    - Requisitos: requisitos.md
    - Backlog: backlog.md
  - Arquitetura:
    - Arquitetura do Sistema: arquitetura.md
    - Algoritmos: algoritmos.md
    - Padrões de Projeto: padroes_projeto.md
    - Decisões de Projeto: decisions.md
  - Desenvolvimento:
    - Utilitários de Grafos: grafos.md
    - Infraestrutura: infraestrutura.md
    - Guia de Implementação: guia_implementacao.md
    - Contribuição: contributing.md
    - Visualizações: visualizacoes.md

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
